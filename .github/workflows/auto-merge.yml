name: Auto Merge Clean Pull Requests

on:
  workflow_run:
    workflows: [CI, AI Pull Request Review]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: write

jobs:
  merge:
    # Limit auto-merge to owner-created PRs because review processes untrusted repository content.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Verify checks, clean AI review, and mergeability
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const workflowNames = new Set(['CI', 'AI Pull Request Review']);
            const repository = await github.rest.repos.get({ owner, repo });

            // Organization-owned repositories are intentionally unsupported by this owner-only policy.
            if (repository.data.owner.type !== 'User') {
              core.notice('Auto-merge is disabled because this repository is not user-owned.');
              return;
            }
            const ownerLogin = repository.data.owner.login;

            const associatedPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: headSha, per_page: 100 }
            );
            const pullRequest = associatedPulls.find((pull) =>
              pull.state === 'open' &&
              pull.user?.login === ownerLogin &&
              pull.head.repo?.full_name === `${owner}/${repo}` &&
              pull.head.sha === headSha
            );

            if (!pullRequest) {
              core.notice(`No open same-repository pull request found for ${headSha}.`);
              return;
            }

            const workflowRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, head_sha: headSha, per_page: 100 }
            );
            const successfulWorkflows = new Set(
              workflowRuns
                .filter((run) => run.conclusion === 'success' && workflowNames.has(run.name))
                .map((run) => run.name)
            );

            if (successfulWorkflows.size !== workflowNames.size) {
              core.notice('CI and AI review have not both passed for the current commit.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const reviewComment = comments.find((comment) =>
              comment.user?.type === 'Bot' &&
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes('<!-- ai-pr-review -->')
            );
            const cleanReview = reviewComment?.body?.includes(
              'PR is approved/clean. No significant issues or findings were found.'
            ) && !reviewComment.body.includes('## Findings');

            if (!cleanReview) {
              core.notice('The AI review comment is not clean/approved.');
              return;
            }

            const currentPull = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullRequest.number,
            });
            if (
              currentPull.data.state !== 'open' ||
              currentPull.data.head.sha !== headSha ||
              currentPull.data.mergeable_state !== 'clean'
            ) {
              core.notice('The pull request changed or is not currently mergeable without conflicts.');
              return;
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullRequest.number,
              merge_method: 'squash',
              sha: headSha,
            });
            core.notice(`Merged pull request #${pullRequest.number} after all checks passed.`);
